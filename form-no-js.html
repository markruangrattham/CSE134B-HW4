<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form without JavaScript</title>
    <link rel="stylesheet" href="style/form-no-js.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="aboutme.html">About me</a>
            <a href="project.html">Project</a>
            <a href="workexperience.html">Work Experience</a>
            <a href="contactme.html">Contact me</a>

            <a href="form-no-js.html" class="toggle-link">Light mode</a>
            <span id="dark"></span>
        </nav>
    </header>
    <main>
        <h1>Form without JavaScript</h1>

        <form action="https://httpbin.org/post" method="POST" class="contact-form" target="_blank">
            <fieldset>
                <legend>No JavaScript Form</legend>
                <input type="hidden" name="possible_bot" value="true"/>
                <label for="name">Name</label>
                <input type="text" name="name" placeholder="Enter your name" required>
                <label for="email">Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
                <label for="comment">Comment</label>
                <textarea name="comment" placeholder="Enter your comment" required></textarea>
                <button type="submit">Submit</button>
              
            </fieldset>
            <div class="output-container">
                <output class="errors">Place holder for errors</output><br>
                <output class="info">Place holder for info</output>
            </div>

        </form>


    </main>
</body>
</html>
